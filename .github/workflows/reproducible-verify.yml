name: Reproducible build verification

# =============================================================================
# Verify that building a Git for Windows release twice, on the same SDK
# snapshot, yields byte-identical artifacts when SOURCE_DATE_EPOCH is set.
#
# This workflow is part of the reproducible-builds effort (see branch
# reproducible-builds/verify) and is intended to be temporary; the release.sh
# changes it exercises are meant to be contributed upstream.
#
# Jobs:
#   pkg-repro       build the mingw-w64-git package twice via makepkg and
#                   compare every member (compile determinism)
#   artifact-repro  build installer/portable/mingit/archive twice via the
#                   release.sh scripts and compare the outputs (packaging
#                   determinism; installer and portable are NOT signed here)
#   signing         optional: sign the same installer twice to confirm that
#                   timestamped code signing prevents byte-identical output
#                   (needs Azure signing secrets configured in this repo)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git for Windows version (e.g. 2.55.0.windows.3); empty = latest upstream'
        required: false
        type: string
      architecture:
        description: 'Architecture to verify'
        required: true
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
      baseline:
        description: 'Also build once without SOURCE_DATE_EPOCH (expect a difference)'
        required: false
        type: boolean
        default: false
      run_signing:
        description: 'Run the signing experiment (requires Azure signing secrets)'
        required: false
        type: boolean
        default: false

env:
  BUILD_EXTRA_REPO: PtJade-Ceramic/build-extra
  BUILD_EXTRA_BRANCH: reproducible-builds/verify

jobs:
  pkg-repro:
    name: pkg-repro (compile determinism)
    runs-on: ${{ inputs.architecture == 'aarch64' && 'windows-11-arm' || 'windows-latest' }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sde: ${{ steps.resolve.outputs.sde }}
    steps:
      - name: Checkout build-extra (verify branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILD_EXTRA_REPO }}
          ref: ${{ env.BUILD_EXTRA_BRANCH }}
          path: work/build-extra

      - name: Set up Git for Windows SDK (build-installers)
        id: setup-sdk
        uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: build-installers
          architecture: ${{ inputs.architecture }}

      - name: Resolve version and SOURCE_DATE_EPOCH
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(gh api repos/git-for-windows/git/releases/latest --jq .tag_name)"
            VERSION="${VERSION#v}"
          fi
          SDK_WIN="${{ steps.setup-sdk.outputs.result }}"
          SDK_MSYS="$(cygpath -u "$SDK_WIN")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SDK_BASH=$SDK_BASH" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              git clone --depth 1 --branch v$1 https://github.com/git-for-windows/git /tmp/git-src >/dev/null 2>&1
              echo SDE=$(git -C /tmp/git-src log -1 --format=%ct)
            ' bash "$VERSION" > /tmp/sde.txt
          SDE="$(sed -n 's/^SDE=//p' /tmp/sde.txt)"
          test -n "$SDE" || { cat /tmp/sde.txt; exit 1; }
          echo "SOURCE_DATE_EPOCH=$SDE"
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "sde=$SDE" >> "$GITHUB_OUTPUT"

      - name: Prepare MINGW-packages and git sources at the tag
        shell: bash
        run: |
          set -e
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              if test ! -d /usr/src/MINGW-packages; then
                git -c core.autocrlf=false clone --depth 1 --single-branch -b main \
                  https://github.com/git-for-windows/MINGW-packages /usr/src/MINGW-packages
              fi
              cd /usr/src/MINGW-packages/mingw-w64-git
              if test ! -d git; then
                git clone --bare https://github.com/git-for-windows/git.git git
              fi
              if test ! -d src/git; then
                git -c core.autocrlf=false -c core.eol=lf clone --reference git https://github.com/git-for-windows/git src/git
                echo ../../../../git/objects > src/git/.git/objects/info/alternates
              fi
              cd src/git
              git fetch origin "refs/tags/v$1:refs/tags/v$1"
              git reset --hard "v$1"
              # The PKGBUILD deliberately runs `unset GIT_VERSION` in build()
              # and rewrites config.mak in prepare(), so neither an exported
              # environment variable nor a config.mak entry can pin the
              # version. GIT-VERSION-GEN does, however, consult a `version`
              # file before falling back to `git describe --dirty`, and that
              # file is honoured on every version_gen invocation (GIT-VERSION-
              # FILE, git.rc, version-def.h alike). Drop one to make the
              # version stable (and clean) for both runs; without it, git.rc
              # and GIT-VERSION-FILE can disagree because each version_gen
              # call re-runs describe at a slightly different worktree state.
              printf "v%s\n" "$1" > version
              # Keep the worktree tidy for the build (DC_SHA1_SUBMODULE).
              git submodule update --init --recursive
              # git.manifest is embedded verbatim as the RT_MANIFEST resource
              # of every standalone executable. Windows checkouts default to
              # CRLF while the makepkg re-checkout in run 2 (which honours
              # the PKGBUILD GIT_CONFIG_PARAMETERS) yields LF, so pin the
              # line endings to LF to keep the embedded bytes identical.
              sed -i "s/\r$//" compat/win32/git.manifest
            ' bash "$VERSION"

      - name: Build mingw-w64-git (run 1)
        shell: bash
        run: |
          set -e
          case "${{ inputs.architecture }}" in
          x86_64) MINGW_ARCH_FLAG=--only-x86_64;;
          aarch64) MINGW_ARCH_FLAG=--only-aarch64;;
          esac
          # Pin the version the way the official git-artifacts.yml does (it
          # exports GIT_VERSION as an environment variable). Without this,
          # GIT-VERSION-GEN falls back to `git describe --dirty`, which
          # reports a dirty worktree while the sha1collisiondetection
          # submodule is not yet checked out, making the version string (and
          # therefore git.rc/git.res/GIT-VERSION-FILE/version-def.h) differ
          # between the two runs.
          export GIT_VERSION="$VERSION"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              echo "GIT_VERSION in SDK bash before export: [$GIT_VERSION]" >&2
              export GIT_VERSION="$1"
              if test ! -d /usr/src/build-extra; then
                git -c core.autocrlf=false clone --single-branch -b $3 \
                  https://github.com/$2 /usr/src/build-extra
              else
                git -C /usr/src/build-extra fetch origin $3
                git -C /usr/src/build-extra switch -C $3 FETCH_HEAD
              fi
              # Patch the mingw-w64-git PKGBUILD to drop the
              # linker-generated CodeView PDB GUID (.debug) from every
              # executable before packaging. The GUID is random per link
              # and would otherwise make the two runs differ in exactly
              # those 16 bytes (everything else, including the .rsrc
              # sections, is already byte-identical at this point).
              python /usr/src/build-extra/ci/patch-pkgbuild.py \
                /usr/src/MINGW-packages/mingw-w64-git/PKGBUILD
              # Match the official release builds: the mingw-w64-git PKGBUILD
              # skips the Rust makedepends when NO_RUST is set, and the pacman
              # databases need to be fresh for makepkg to resolve dependencies.
              export NO_RUST=UnfortunatelyYes
              pacman -Sy --noconfirm
              # makepkg-mingw needs a /usr/bin/git; the build-installers SDK
              # only ships $MINGW_PREFIX/bin/git.exe, so provide a wrapper
              # (same as the official git-artifacts.yml does).
              if test ! -x /usr/bin/git; then
                printf "#!/bin/sh\n\nexec %s/bin/git.exe \"\$@\"\n" "$MINGW_PREFIX" > /usr/bin/git
              fi
              # build-mingw-w64-git resolves the release tag relative to the
              # current repository, so it must run from the git sources.
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              # config.mak injection does not work: the prepare() of the
              # PKGBUILD overwrites config.mak and its build() unsets
              # GIT_VERSION, so GIT-VERSION-GEN always falls back to
              # `git describe --dirty`. What matters is that the working tree
              # is clean (submodule checked out, see the prepare step), so
              # describe is stable.
              /usr/src/build-extra/please.sh build-mingw-w64-git --reset-pkgrel --maybe-sync $4 -o "$5" HEAD
            ' bash "$VERSION" "${{ env.BUILD_EXTRA_REPO }}" "${{ env.BUILD_EXTRA_BRANCH }}" "$MINGW_ARCH_FLAG" "$(cygpath -u "$GITHUB_WORKSPACE")/pkg1"
          # Fingerprint the generated build inputs. git.rc/git.res feed the
          # .rsrc section of every standalone executable via $(LIBS); if they
          # differ between the runs, that explains the 0x30 .rsrc delta.
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              echo === ls git.rc git.res version ===
              ls -la git.rc git.res version 2>&1 || true
              echo === cat version ===
              cat version 2>/dev/null || true
              echo === head git.rc ===
              head -5 git.rc 2>/dev/null || true
              echo === sha256 ===
              sha256sum git.rc git.res GIT-VERSION-FILE version-def.h 2>/dev/null || true
            ' > "$W/run1-hashes.txt" || true
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              echo === GIT-VERSION-FILE ===
              cat GIT-VERSION-FILE 2>/dev/null || true
              echo === version-def.h ===
              cat version-def.h 2>/dev/null || true
            ' > "$W/run1-versions.txt" || true
          cat "$W/run1-hashes.txt" || true

      - name: Build mingw-w64-git (run 2, clean rebuild)
        shell: bash
        run: |
          set -e
          case "${{ inputs.architecture }}" in
          x86_64) MINGW_ARCH_FLAG=--only-x86_64;;
          aarch64) MINGW_ARCH_FLAG=--only-aarch64;;
          esac
          # Pin the version; see run 1 for why.
          export GIT_VERSION="$VERSION"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              echo "GIT_VERSION in SDK bash before export: [$GIT_VERSION]" >&2
              export GIT_VERSION="$1"
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              git clean -xdf
              # Re-create the version file (the stable source of the version
              # for GIT-VERSION-GEN; see the prepare step) and ensure the
              # sha1collisiondetection submodule is checked out.
              printf "v%s\n" "$1" > version
              git submodule update --init --recursive
              # Pin the manifest line endings to LF (see the prepare step);
              # the makepkg re-checkout normalises them already, this makes
              # it explicit and immune to checkout configuration drift.
              sed -i "s/\r$//" compat/win32/git.manifest
              cd /usr/src/MINGW-packages/mingw-w64-git
              rm -rf pkg
              # Drop the packages produced by run 1, otherwise makepkg
              # refuses to rebuild ("package group has already been built").
              rm -f *.pkg.tar.xz
              # Match the official release builds: the mingw-w64-git PKGBUILD
              # skips the Rust makedepends when NO_RUST is set, and makepkg
              # needs a /usr/bin/git wrapper (see run 1).
              export NO_RUST=UnfortunatelyYes
              if test ! -x /usr/bin/git; then
                printf "#!/bin/sh\n\nexec %s/bin/git.exe \"\$@\"\n" "$MINGW_PREFIX" > /usr/bin/git
              fi
              # build-mingw-w64-git resolves the release tag relative to the
              # current repository, so it must run from the git sources.
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              /usr/src/build-extra/please.sh build-mingw-w64-git --reset-pkgrel --maybe-sync $2 -o "$3" HEAD
            ' bash "$VERSION" "$MINGW_ARCH_FLAG" "$(cygpath -u "$GITHUB_WORKSPACE")/pkg2"
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              echo === ls git.rc git.res version ===
              ls -la git.rc git.res version 2>&1 || true
              echo === cat version ===
              cat version 2>/dev/null || true
              echo === head git.rc ===
              head -5 git.rc 2>/dev/null || true
              echo === sha256 ===
              sha256sum git.rc git.res GIT-VERSION-FILE version-def.h 2>/dev/null || true
            ' > "$W/run2-hashes.txt" || true
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              cd /usr/src/MINGW-packages/mingw-w64-git/src/git
              echo === GIT-VERSION-FILE ===
              cat GIT-VERSION-FILE 2>/dev/null || true
              echo === version-def.h ===
              cat version-def.h 2>/dev/null || true
            ' > "$W/run2-versions.txt" || true
          cat "$W/run2-hashes.txt" || true

      - name: Compare pkg1 vs pkg2
        shell: bash
        run: |
          set -e
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              cd /usr/src/build-extra
              # Diagnose the fingerprints and contents of the generated build
              # inputs (git.rc / git.res / version files).
              echo "== build-input fingerprints (git.rc / git.res / version files)"
              echo "--- run1-hashes.txt ---"
              cat "$1/run1-hashes.txt" 2>&1 || true
              echo "--- run2-hashes.txt ---"
              cat "$1/run2-hashes.txt" 2>&1 || true
              diff -u "$1/run1-hashes.txt" "$1/run2-hashes.txt" || true
              echo "== version file contents (GIT-VERSION-FILE / version-def.h)"
              diff -u "$1/run1-versions.txt" "$1/run2-versions.txt" || true
              # git.exe is byte-identical between the runs; confirm whether it
              # even has a resource section (it should, if $(LIBS) carries
              # git.res into its link as well) and what version string it
              # embeds (dirty vs clean). If tar yields 0 bytes the member is
              # likely a hardlink/symlink, so also show its tar entry.
              for side in 1 2
              do
                  p="$(ls "$1/pkg$side"/*-any.pkg.tar.xz 2>/dev/null | head -1)"
                  m="$(tar -tf "$p" 2>/dev/null | grep "/bin/git.exe\$" | head -1)"
                  test -n "$m" || continue
                  tar -xOf "$p" "$m" > "/tmp/git$side.exe" 2>/dev/null || true
                  sz=$(wc -c <"/tmp/git$side.exe" 2>/dev/null || echo 0)
                  echo "git.exe (run $side) extract: $sz bytes"
                  if test "$sz" -gt 0
                  then
                      echo "git.exe (run $side) sections:"
                      objdump -h "/tmp/git$side.exe" 2>/dev/null | sed -n 5,30p
                      echo "git.exe (run $side) version strings:"
                      strings "/tmp/git$side.exe" 2>/dev/null | grep "2.55.0" | head -5
                  else
                      echo "git.exe (run $side) tar entry: $(tar -tvf "$p" 2>/dev/null | grep "/bin/git.exe" | head -2)"
                  fi
              done
              for p in "$1/pkg1"/*-any.pkg.tar.xz; do
                test -f "$p" || continue
                b=$(basename "$p")
                # The -pdb package contains PDB files produced by cv2pdb
                # via the Microsoft mspdb library, which embeds a random
                # GUID and a timestamp. cv2pdb has no deterministic mode,
                # so those files cannot be byte-identical between two
                # builds; this is a toolchain limitation (upstream would
                # need a cv2pdb change), unrelated to SOURCE_DATE_EPOCH.
                # Skip it here and report it separately below.
                case "$b" in
                *-pdb-*)
                  echo "SKIP (cv2pdb PDB, known non-reproducible): $b" >&2
                  continue
                  ;;
                esac
                test -f "$1/pkg2/$b" || { echo "MISSING in run 2: $b"; exit 1; }
                echo "== comparing $b"
                ./ci/verify-reproducible.sh --pkg "$1/pkg1/$b" "$1/pkg2/$b"
              done
            ' bash "$W"

      - name: Upload pkg1 (for artifact-repro)
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ inputs.architecture }}
          path: pkg1
          if-no-files-found: error

  artifact-repro:
    name: artifact-repro (packaging determinism)
    needs: pkg-repro
    runs-on: ${{ inputs.architecture == 'aarch64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      VERSION: ${{ needs.pkg-repro.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.pkg-repro.outputs.sde }}
    steps:
      - name: Checkout build-extra (verify branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILD_EXTRA_REPO }}
          ref: ${{ env.BUILD_EXTRA_BRANCH }}
          path: work/build-extra

      - name: Set up Git for Windows SDK (build-installers)
        id: setup-sdk
        uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: build-installers
          architecture: ${{ inputs.architecture }}

      - name: Download pkg1
        uses: actions/download-artifact@v4
        with:
          name: pkg-${{ inputs.architecture }}
          path: pkg1

      - name: Build artifacts (run 1)
        shell: bash
        run: |
          set -e
          SDK_MSYS="$(cygpath -u "${{ steps.setup-sdk.outputs.result }}")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              if test ! -d /usr/src/build-extra; then
                git -c core.autocrlf=false clone --single-branch -b $2 \
                  https://github.com/$1 /usr/src/build-extra
              else
                git -C /usr/src/build-extra fetch origin $2
                git -C /usr/src/build-extra switch -C $2 FETCH_HEAD
              fi
              cd /usr/src/build-extra
              export SOURCE_DATE_EPOCH="$3"
              echo "==> SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
              ./please.sh make_installers_from_mingw_w64_git \
                --version="$4" -o "$5" \
                --installer --portable --mingit --archive \
                --pkg="$(ls "$6"/*-any.pkg.tar.xz | paste -sd, -)"
            ' bash "${{ env.BUILD_EXTRA_REPO }}" "${{ env.BUILD_EXTRA_BRANCH }}" "$SOURCE_DATE_EPOCH" "$VERSION" "$W/dist1" "$W/pkg1"

      - name: Build artifacts (run 2)
        shell: bash
        run: |
          set -e
          SDK_MSYS="$(cygpath -u "${{ steps.setup-sdk.outputs.result }}")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              if test ! -d /usr/src/build-extra; then
                git -c core.autocrlf=false clone --single-branch -b $2 \
                  https://github.com/$1 /usr/src/build-extra
              else
                git -C /usr/src/build-extra fetch origin $2
                git -C /usr/src/build-extra switch -C $2 FETCH_HEAD
              fi
              cd /usr/src/build-extra
              export SOURCE_DATE_EPOCH="$3"
              echo "==> SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
              ./please.sh make_installers_from_mingw_w64_git \
                --version="$4" -o "$5" \
                --installer --portable --mingit --archive \
                --pkg="$(ls "$6"/*-any.pkg.tar.xz | paste -sd, -)"
            ' bash "${{ env.BUILD_EXTRA_REPO }}" "${{ env.BUILD_EXTRA_BRANCH }}" "$SOURCE_DATE_EPOCH" "$VERSION" "$W/dist2" "$W/pkg1"

      - name: Build artifacts (baseline, no SOURCE_DATE_EPOCH)
        if: inputs.baseline == true
        shell: bash
        run: |
          set -e
          SDK_MSYS="$(cygpath -u "${{ steps.setup-sdk.outputs.result }}")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              cd /usr/src/build-extra
              unset SOURCE_DATE_EPOCH
              ./please.sh make_installers_from_mingw_w64_git \
                --version="$2" -o "$3" \
                --installer --portable --mingit --archive \
                --pkg="$(ls "$4"/*-any.pkg.tar.xz | paste -sd, -)"
            ' bash "${{ env.BUILD_EXTRA_REPO }}" "$VERSION" "$W/dist0" "$W/pkg1"

      - name: Compare dist1 vs dist2
        shell: bash
        run: |
          set -e
          SDK_MSYS="$(cygpath -u "${{ steps.setup-sdk.outputs.result }}")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              set -e
              cd /usr/src/build-extra
              verify_status=0
              ./ci/verify-reproducible.sh --dir "$1" "$2" || verify_status=$?
              # For archives, list member timestamps on both sides to
              # pinpoint which member (file or directory) differs.
              for f in "$1"/*.exe "$1"/*.tar.bz2 "$1"/*.zip "$1"/*.7z.exe
              do
                test -f "$f" || continue
                b=$(basename "$f")
                test -f "$2/$b" || continue
                echo "=== $b: member metadata (run1 vs run2)" >&2
                7z l -slt -ba "$1/$b" 2>/dev/null > /tmp/ar.txt || true
                7z l -slt -ba "$2/$b" 2>/dev/null > /tmp/br.txt || true
                if ! cmp -s /tmp/ar.txt /tmp/br.txt
                then
                    echo "--- full -slt diff (first 160 lines) ---" >&2
                    diff -u /tmp/ar.txt /tmp/br.txt | head -160 || true
                else
                    echo "--- 7z -slt member metadata identical ---" >&2
                    # The member timestamps/sizes match; the archive bytes
                    # still differ, so compare the archive header itself.
                    7z l -slt "$1/$b" 2>/dev/null | head -30 > /tmp/ah.txt || true
                    7z l -slt "$2/$b" 2>/dev/null | head -30 > /tmp/bh.txt || true
                    diff -u /tmp/ah.txt /tmp/bh.txt | head -60 || true
                    # Raw first/last bytes of the archive (header / sfx region).
                    echo "--- archive head/tail bytes ---" >&2
                    for side in "$1/$b" "$2/$b"
                    do
                        sz=$(wc -c < "$side")
                        tail_off=$((sz - 64))
                        test "$tail_off" -lt 0 && tail_off=0
                        echo "  [$side] head: $(od -An -tx1 -N 64 "$side" 2>/dev/null | tr -d "\n")" >&2
                        echo "  [$side] tail: $(od -An -tx1 -j "$tail_off" -N 64 "$side" 2>/dev/null | tr -d "\n")" >&2
                    done
                fi
              done
              exit $verify_status
            ' bash "$W/dist1" "$W/dist2"

      - name: Compare dist1 vs baseline (expect a difference)
        if: inputs.baseline == true
        shell: bash
        run: |
          set +e
          SDK_MSYS="$(cygpath -u "${{ steps.setup-sdk.outputs.result }}")"
          case "$SDK_MSYS" in
          /) SDK_BASH=/usr/bin/bash.exe;;
          *) SDK_BASH="$SDK_MSYS/usr/bin/bash.exe";;
          esac
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=${{ inputs.architecture == 'aarch64' && 'CLANGARM64' || 'MINGW64' }} \
            "$SDK_BASH" --login -c '
              cd /usr/src/build-extra
              ./ci/verify-reproducible.sh --dir "$1" "$2"
            ' bash "$W/dist1" "$W/dist0"
          rc=$?
          if test "$rc" = 0; then
            echo "UNEXPECTED: baseline build is identical to the pinned one"
            exit 1
          fi
          echo "OK: baseline (no SOURCE_DATE_EPOCH) differs, as expected"

      - name: Upload dist1 and dist2
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.architecture }}
          path: |
            dist1
            dist2
          if-no-files-found: error

  signing:
    name: signing (timestamped signatures differ)
    needs: artifact-repro
    # Note: secrets cannot be referenced in job-level if conditions, so the
    # job always starts when requested and the steps below gate on the env
    # copies of the Azure signing secrets.
    if: inputs.run_signing == 'true'
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_OPTS: ${{ secrets.AZURE_SIGNING_OPTS }}
    steps:
      - name: Skip when signing secrets are not configured
        if: env.AZURE_CLIENT_ID == ''
        shell: bash
        run: |
          echo "Azure signing secrets are not configured in this repository;"
          echo "skipping the signing experiment (RFC 3161 timestamped"
          echo "signatures are expected to differ between runs by design)."

      - name: Download dist1
        if: env.AZURE_CLIENT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.architecture }}
          path: dist1

      - name: Checkout automation (for azure-signtool.sh)
        if: env.AZURE_CLIENT_ID != ''
        uses: actions/checkout@v4
        with:
          repository: git-for-windows/git-for-windows-automation
          path: automation

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the same installer twice and compare
        if: env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          set -e
          git config --global alias.signtool "!sh \"$PWD/automation/azure-signtool.sh\""
          cp dist1/Git-*.exe signed1.exe
          cp dist1/Git-*.exe signed2.exe
          git signtool signed1.exe
          git signtool signed2.exe
          sha256sum signed1.exe signed2.exe
          # RFC 3161 timestamps differ between runs, so the signatures must
          # differ too, even though the payload is identical.
          if cmp -s signed1.exe signed2.exe; then
            echo "UNEXPECTED: the two signed binaries are identical"
            exit 1
          fi
          echo "OK: signed binaries differ (timestamped signatures), as expected"
